<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETordle</title>
<style>
  :root{
    --bg:#ffffff;
    --fg:#000000;
    --gray:#767676;
    --mid:#cfcfcf;
    --border:#000000;
    --green:#2e8b3d;
    --green-bg:#e3f3e5;
    --yellow:#b8960c;
    --yellow-bg:#fff3c4;
    --red:#b3261e;
    --red-bg:#fbe4e2;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  }
  html[data-theme="dark"]{
    --bg:#121212;
    --fg:#f2f2f2;
    --gray:#a0a0a0;
    --mid:#3a3a3a;
    --border:#f2f2f2;
    --green:#7fd88f;
    --green-bg:#1c3320;
    --yellow:#f0cf5c;
    --yellow-bg:#3a3010;
    --red:#f28b82;
    --red-bg:#3a1a17;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    min-height:100vh;
    padding:26px 14px 50px;
  }
  .wrap{max-width:720px;margin:0 auto;}
  header{text-align:center;margin-bottom:18px;position:relative;}
  .theme-toggle{
    position:absolute;
    top:0;
    right:0;
    background:var(--bg);
    border:1px solid var(--border);
    color:var(--fg);
    width:34px;
    height:34px;
    padding:0;
    font-size:16px;
    line-height:1;
    cursor:pointer;
  }
  .theme-toggle:hover{background:var(--fg);color:var(--bg);}
  h1{margin:0 0 4px;font-size:26px;font-weight:700;letter-spacing:0;}
  .sub{color:var(--gray);font-size:13px;margin:0;}

  .panel{
    border:1px solid var(--border);
    padding:18px;
    margin-top:16px;
  }

  /* ---- menu / settings ---- */
  .nav-title{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--gray);
    margin:0 0 10px;
  }
  .settings-row{
    margin-bottom:16px;
    padding-bottom:16px;
    border-bottom:1px solid var(--mid);
  }
  .settings-row:last-of-type{border-bottom:none;margin-bottom:8px;padding-bottom:0;}
  .settings-label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:8px;
  }
  .guess-count-row{display:flex;align-items:center;gap:10px;}
  input[type=number]{
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--fg);
    padding:6px 8px;
    width:70px;
    font-size:14px;
  }
  .hint-toggles{display:flex;gap:14px;flex-wrap:wrap;}
  .hint-toggles label{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    cursor:pointer;
  }
  .hint-toggles input{accent-color:var(--fg);}

  button{
    background:var(--bg);
    border:1px solid var(--border);
    color:var(--fg);
    padding:9px 18px;
    font-size:13px;
    cursor:pointer;
  }
  button:hover{background:var(--fg);color:var(--bg);}
  button:disabled{opacity:.35;cursor:default;}
  button:disabled:hover{background:var(--bg);color:var(--fg);}
  .btn-row{display:flex;justify-content:center;gap:8px;margin-top:16px;}

  /* ---- navigation drill-down ---- */
  .breadcrumb{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:14px;
    font-size:12px;
    color:var(--gray);
  }
  .crumb-btn{
    background:none;
    border:none;
    color:var(--fg);
    padding:0;
    font-size:12px;
    text-decoration:underline;
    cursor:pointer;
  }
  .crumb-btn:hover{background:none;color:var(--fg);}
  .crumb-sep{opacity:.5;}

  .nav-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(140px,1fr));
    gap:8px;
    align-items:start;
  }
  .nav-grid.towers{
    grid-template-columns:repeat(auto-fill, minmax(170px,1fr));
  }
  .ring-card{
    border:1px solid var(--border);
    padding:6px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .nav-btn{
    background:var(--bg);
    border:1px solid var(--border);
    color:var(--fg);
    padding:0;
    font-size:12px;
    cursor:pointer;
    text-align:left;
    width:100%;
    display:flex;
    align-items:stretch;
    gap:0;
    overflow:hidden;
  }
  .nav-btn .btn-label{
    flex:1;
    padding:8px 10px;
    align-self:center;
  }
  .nav-btn .btn-emblem{
    height:auto;
    width:44px;
    align-self:stretch;
    object-fit:cover;
    opacity:.55;
    flex-shrink:0;
  }
  .nav-btn:hover{background:var(--fg);color:var(--bg);}
  .nav-btn.sub{
    border-style:dashed;
    font-size:11px;
  }
  .nav-btn.sub .btn-label{
    padding:6px 8px 6px 16px;
  }
  .nav-btn.empty{opacity:.3;cursor:default;}
  .nav-btn.empty:hover{background:var(--bg);color:var(--fg);}
  .nav-btn.tower{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:2px;
    padding:10px 14px;
  }
  .nav-btn.themed{
    color:#fff;
    border-color:rgba(255,255,255,.65);
    background-size:cover;
    background-position:center;
    text-shadow:0 1px 3px rgba(0,0,0,.9), 0 0 2px rgba(0,0,0,.9);
    position:relative;
  }
  .nav-btn.themed:hover{
    filter:brightness(1.25);
    color:#fff;
  }
  .nav-btn.tower .t-meta{font-size:10px;opacity:.75;}

  .guesses-left{
    text-align:center;
    margin:10px 0 6px;
    font-size:12px;
    color:var(--gray);
  }
  .pips{display:flex;justify-content:center;gap:6px;margin:0 0 14px;}
  .pip{width:9px;height:9px;border:1px solid var(--border);background:var(--bg);}
  .pip.used{background:var(--fg);}

  /* ---- board ---- */
  table.board{width:100%;border-collapse:collapse;margin-top:10px;}
  table.board th{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--gray);
    text-align:left;
    padding:0 6px 6px;
    font-weight:normal;
    border-bottom:1px solid var(--border);
  }
  table.board td{
    padding:8px 6px;
    font-size:12px;
    vertical-align:middle;
    border-bottom:1px solid var(--mid);
  }
  .cell{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:5px 9px;
    border:1px solid var(--border);
    width:100%;
  }
  .cell.hit{background:var(--green-bg);color:var(--green);border-color:var(--green);}
  .cell.part{background:var(--yellow-bg);color:var(--yellow);border-color:var(--yellow);}
  .cell.miss{background:var(--red-bg);color:var(--red);border-color:var(--red);}
  .cell.mixed{background:var(--bg);color:var(--fg);border-color:var(--fg);}
  .name-match{
    background:var(--yellow-bg);
    color:var(--yellow);
    border:1px solid var(--yellow);
    padding:1px 5px;
    font-weight:bold;
  }
  .name-miss{
    background:var(--red-bg);
    color:var(--red);
    border:1px solid var(--red);
    padding:1px 5px;
  }
  .tower-name-cell{font-weight:bold;}
  .arrow{font-size:11px;opacity:.85;}

  .result{
    margin-top:16px;
    padding:14px;
    border:1px solid var(--border);
    text-align:center;
    display:none;
  }
  .result.show{display:block;}
  .result h2{margin:0 0 6px;font-size:16px;}
  .result p{margin:4px 0;color:var(--gray);font-size:12px;line-height:1.5;}
  .result .fact{
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid var(--mid);
    color:var(--fg);
  }

  .legend{
    display:flex;
    justify-content:center;
    gap:16px;
    flex-wrap:wrap;
    margin-top:14px;
    font-size:11px;
    color:var(--gray);
  }

  @media (max-width:560px){
    table.board thead{display:none;}
    table.board tr{display:block;margin-bottom:10px;border:1px solid var(--border);padding:6px;}
    table.board td{display:flex;justify-content:space-between;align-items:center;border:none;padding:5px 3px;}
    table.board td::before{content:attr(data-label);font-size:9px;text-transform:uppercase;color:var(--gray);}
    .cell{justify-content:flex-end;width:auto;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">◐</button>
    <h1>ETordle</h1>
    <p class="sub">Guess the Eternal Towers of Hell tower.</p>
  </header>

  <div class="panel" id="menu-screen">
    <p class="nav-title">Settings</p>

    <div class="settings-row">
      <span class="settings-label">Guesses</span>
      <div class="guess-count-row">
        <input type="number" id="guess-count" min="1" max="10" value="3">
      </div>
    </div>

    <div class="settings-row">
      <span class="settings-label">Hints shown</span>
      <div class="hint-toggles">
        <label><input type="checkbox" class="hint-toggle" value="type" checked> Type</label>
        <label><input type="checkbox" class="hint-toggle" value="realm" checked> Realm</label>
        <label><input type="checkbox" class="hint-toggle" value="area" checked> Area</label>
        <label><input type="checkbox" class="hint-toggle" value="difficulty" checked> Difficulty</label>
        <label><input type="checkbox" class="hint-toggle" value="creator" checked> Creator</label>
      </div>
    </div>

    <div class="btn-row">
      <button id="start-btn">Start</button>
    </div>
  </div>

  <div class="panel" id="game-screen" style="display:none;">
    <div class="breadcrumb" id="breadcrumb"></div>
    <p class="nav-title" id="nav-title">Choose a realm</p>
    <div class="nav-grid" id="nav-grid"></div>

    <div class="guesses-left" id="guesses-left"></div>
    <div class="pips" id="pips"></div>

    <table class="board" id="board">
      <thead>
        <tr id="board-head"></tr>
      </thead>
      <tbody id="board-body"></tbody>
    </table>

    <div class="result" id="result">
      <h2 id="result-title"></h2>
      <p id="result-body"></p>
      <p class="fact" id="result-fact"></p>
    </div>

    <div class="legend">
      <span>✓ exact</span>
      <span>≈ partial</span>
      <span>✕ miss</span>
    </div>

    <div class="btn-row">
      <button id="menu-btn">Menu</button>
      <button id="new-game-btn">New tower</button>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script>
const ALL_COLUMNS = [
  { key:"type", label:"Type" },
  { key:"realm", label:"Realm" },
  { key:"area", label:"Area" },
  { key:"difficulty", label:"Difficulty" },
  { key:"creator", label:"Creator" }
];

let MAX_GUESSES = 3;
let activeColumns = ALL_COLUMNS.map(c=>c.key);

let target = null;
let guessesUsed = 0;
let over = false;
let navRealm = null;
let navArea = null;

/* ---------- theme ---------- */

const themeToggle = document.getElementById('theme-toggle');

function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  themeToggle.textContent = theme === 'dark' ? '☀' : '◐';
  try{ localStorage.setItem('etordle-theme', theme); }catch(e){}
}

(function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem('etordle-theme'); }catch(e){}
  if(!saved){
    saved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  applyTheme(saved);
})();

themeToggle.addEventListener('click', ()=>{
  const current = document.documentElement.getAttribute('data-theme');
  applyTheme(current === 'dark' ? 'light' : 'dark');
});

const menuScreen = document.getElementById('menu-screen');
const gameScreen = document.getElementById('game-screen');
const startBtn = document.getElementById('start-btn');
const guessCountInput = document.getElementById('guess-count');
const hintToggles = document.querySelectorAll('.hint-toggle');
const menuBtn = document.getElementById('menu-btn');

const navGrid = document.getElementById('nav-grid');
const navTitle = document.getElementById('nav-title');
const breadcrumbEl = document.getElementById('breadcrumb');
const boardHead = document.getElementById('board-head');
const boardBody = document.getElementById('board-body');
const guessesLeftEl = document.getElementById('guesses-left');
const pipsEl = document.getElementById('pips');
const resultEl = document.getElementById('result');
const resultTitle = document.getElementById('result-title');
const resultBody = document.getElementById('result-body');
const resultFact = document.getElementById('result-fact');
const newGameBtn = document.getElementById('new-game-btn');

function areaKey(fullLabel){
  return fullLabel.split(' - ')[0];
}

function towersInArea(fullLabel){
  const key = areaKey(fullLabel);
  return TOWERS.filter(t=>t.area === key);
}

function symbol(status){
  return status === 'hit' ? '✓' : status === 'part' ? '≈' : '✕';
}

function cellClass(status){
  return status === 'hit' ? 'hit' : status === 'part' ? 'part' : 'miss';
}

/* ---------- settings / menu ---------- */

function buildHeader(){
  boardHead.innerHTML = '<th>Tower</th>' +
    activeColumns.map(k => `<th>${ALL_COLUMNS.find(c=>c.key===k).label}</th>`).join('');
}

startBtn.addEventListener('click', ()=>{
  let n = parseInt(guessCountInput.value, 10);
  if(isNaN(n) || n < 1) n = 1;
  if(n > 10) n = 10;
  MAX_GUESSES = n;
  guessCountInput.value = n;

  activeColumns = Array.from(hintToggles).filter(cb=>cb.checked).map(cb=>cb.value);

  buildHeader();
  menuScreen.style.display = 'none';
  gameScreen.style.display = 'block';
  newGame();
});

menuBtn.addEventListener('click', ()=>{
  gameScreen.style.display = 'none';
  menuScreen.style.display = 'block';
});

/* ---------- drill-down nav ---------- */

function renderBreadcrumb(){
  const parts = [];
  parts.push(`<button class="crumb-btn" data-nav="realm">Select</button>`);
  if(navRealm){
    parts.push(`<span class="crumb-sep">/</span>`);
    parts.push(`<button class="crumb-btn" data-nav="area">${navRealm}</button>`);
  }
  if(navArea){
    parts.push(`<span class="crumb-sep">/</span>`);
    parts.push(`<span>${navArea}</span>`);
  }
  breadcrumbEl.innerHTML = parts.join('');
  breadcrumbEl.querySelectorAll('.crumb-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(b.dataset.nav === 'realm'){ navRealm=null; navArea=null; }
      if(b.dataset.nav === 'area'){ navArea=null; }
      renderNav();
    });
  });
}

/* ---------- area background themes ---------- */

const AREA_THEMES = {
  "The Great Inferno": "linear-gradient(135deg,#3a0a05,#c1440e)",
  "The Spatial System": "linear-gradient(135deg,#03122e,#1f5fa8)",

  "Ring 0 - Purgatorio": "linear-gradient(135deg,#4a3618,#a9793f)",
  "Ring 1 - Limbo": "linear-gradient(135deg,#2c2c34,#6d6d7a)",
  "Forgotten Ridge": "linear-gradient(135deg,#22301a,#54683a)",
  "Ring 2 - Desire": "linear-gradient(135deg,#5c1010,#b8385a)",
  "Garden of Eeshöl": "linear-gradient(135deg,#123018,#3c8a52)",
  "Ring 3 - Gluttony": "linear-gradient(135deg,#4a1006,#a3421a)",
  "Ring 4 - Greed": "linear-gradient(135deg,#132b12,#3f7a3a)",
  "Silent Abyss": "linear-gradient(135deg,#040611,#161c3a)",
  "Ring 5 - Wrath": "linear-gradient(135deg,#420505,#b31313)",
  "Lost River": "linear-gradient(135deg,#062a2e,#1c8a92)",
  "Ring 6 - Heresy": "linear-gradient(135deg,#331b0a,#8a4a1a)",
  "Ashen Towerworks": "linear-gradient(135deg,#26221f,#5c5650)",
  "Ring 7 - Violence": "linear-gradient(135deg,#360a1a,#96204f)",
  "Ring 8 - Fraud": "linear-gradient(135deg,#1c0e33,#5a2f96)",
  "The Starlit Archives": "linear-gradient(135deg,#04061c,#232a63)",
  "Ring 9 - Treachery": "linear-gradient(135deg,#0a0a12,#232840)",

  "Zone 1 - Sea": "linear-gradient(135deg,#032a33,#0f8fa3)",
  "Steelspire Horizon": "linear-gradient(135deg,#232b33,#5c6f7d)",
  "Zone 2 - Surface": "linear-gradient(135deg,#12331a,#3f8a4a)",
  "Arcane Area": "linear-gradient(135deg,#2a0e3a,#7d2fb8)",
  "Zone 3 - Sky": "linear-gradient(135deg,#08315c,#3f8fd6)",
  "Paradise Atoll": "linear-gradient(135deg,#053a2e,#1fb391)",
  "Zone 4 - Exosphere": "linear-gradient(135deg,#0a1030,#2f3fa3)",
  "Zone 5 - The Moon": "linear-gradient(135deg,#20242e,#565d6e)",
  "Zone 6 - Mars": "linear-gradient(135deg,#3a1206,#a3441a)",
  "Zone 7 - Asteroid Belt": "linear-gradient(135deg,#1a1a20,#4a4a56)",
  "Zone 8 - Pluto": "linear-gradient(135deg,#0e1533,#2f3f7d)",
  "Zone 9 - Singularity": "linear-gradient(135deg,#10041c,#3a0f5c)",
  "Zone 10 - Interstellar Shore": "linear-gradient(135deg,#0a0618,#2a1050)"
};

function buttonInnerHTML(label, displayText){
  const emblem = AREA_EMBLEMS[label];
  let html = '';
  if(emblem){
    html += `<img class="btn-emblem" src="${emblem}" alt="">`;
  }
  html += `<span class="btn-label">${displayText}</span>`;
  return html;
}

function applyAreaTheme(btn, label){
  const img = AREA_IMAGES[label];
  if(img){
    btn.classList.add('themed');
    btn.style.backgroundImage = `linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)), url('${img}')`;
    return;
  }
  const gradient = AREA_THEMES[label];
  if(gradient){
    btn.classList.add('themed');
    btn.style.backgroundImage = gradient;
  }
}

function renderNav(){
  if(over){
    navGrid.innerHTML = '';
    navTitle.textContent = '';
    breadcrumbEl.innerHTML = '';
    return;
  }
  renderBreadcrumb();
  navGrid.innerHTML = '';
  navGrid.classList.remove('towers');

  if(!navRealm){
    navTitle.textContent = 'Choose a realm';
    [REALM_INFERNO, REALM_SPATIAL].forEach(r=>{
      const b = document.createElement('button');
      b.className = 'nav-btn';
      b.innerHTML = buttonInnerHTML(r, r);
      applyAreaTheme(b, r);
      b.addEventListener('click', ()=>{ navRealm = r; navArea = null; renderNav(); });
      navGrid.appendChild(b);
    });
    return;
  }

  if(!navArea){
    navTitle.textContent = 'Choose a ring / zone';
    AREA_GROUPS.filter(g=>g.realm === navRealm).forEach(g=>{
      const card = document.createElement('div');
      card.className = 'ring-card';

      const mainCount = towersInArea(g.main).length;
      const mainBtn = document.createElement('button');
      mainBtn.className = 'nav-btn' + (mainCount===0 ? ' empty' : '');
      mainBtn.innerHTML = buttonInnerHTML(g.main, g.main);
      if(mainCount===0){
        mainBtn.disabled = true;
      } else {
        applyAreaTheme(mainBtn, g.main);
        mainBtn.addEventListener('click', ()=>{ navArea = g.main; renderNav(); });
      }
      card.appendChild(mainBtn);

      if(g.sub){
        const subCount = towersInArea(g.sub).length;
        const subBtn = document.createElement('button');
        subBtn.className = 'nav-btn sub' + (subCount===0 ? ' empty' : '');
        subBtn.innerHTML = buttonInnerHTML(g.sub, `↳ ${g.sub}`);
        if(subCount===0){
          subBtn.disabled = true;
        } else {
          applyAreaTheme(subBtn, g.sub);
          subBtn.addEventListener('click', ()=>{ navArea = g.sub; renderNav(); });
        }
        card.appendChild(subBtn);
      }

      navGrid.appendChild(card);
    });
    return;
  }

  navTitle.textContent = 'Choose your guess';
  navGrid.classList.add('towers');
  towersInArea(navArea).forEach(t=>{
    const b = document.createElement('button');
    b.className = 'nav-btn tower';
    b.innerHTML = `<span class="t-name">${t.name}</span><span class="t-meta">${t.abbr} - ${t.type}</span>`;
    b.addEventListener('click', ()=>handleGuess(t));
    navGrid.appendChild(b);
  });
}

function renderPips(){
  pipsEl.innerHTML = '';
  for(let i=0;i<MAX_GUESSES;i++){
    const d = document.createElement('div');
    d.className = 'pip' + (i < guessesUsed ? ' used' : '');
    pipsEl.appendChild(d);
  }
}

/* ---------- guessing / scoring ---------- */

function diffArrow(guess, target){
  if(guess.rating != null && target.rating != null){
    if(guess.rating === target.rating) return '';
    return guess.rating < target.rating ? '<span class="arrow">▲ harder</span>' : '<span class="arrow">▼ easier</span>';
  }
  const gi = DIFF_ORDER.indexOf(guess.difficulty);
  const ti = DIFF_ORDER.indexOf(target.difficulty);
  if(gi === ti) return '';
  return gi < ti ? '<span class="arrow">▲ harder</span>' : '<span class="arrow">▼ easier</span>';
}

function diffLabel(t){
  return t.rating != null ? `${t.rating.toFixed(2)} (${t.difficulty})` : `${t.difficulty} (unrated)`;
}

function makeRow(guess){
  const tr = document.createElement('tr');

  const typeStatus = guess.type === target.type ? 'hit' : 'miss';
  const realmStatus = guess.realm === target.realm ? 'hit' : 'miss';
  const areaStatus = guess.area === target.area ? 'hit' : 'miss';

  let diffStatus;
  if(guess.difficulty === target.difficulty){
    diffStatus = (guess.rating === target.rating) ? 'hit' : 'part';
  } else {
    diffStatus = 'miss';
  }

  const targetCreators = new Set(target.creators);
  const sameSet = guess.creators.length === target.creators.length &&
    guess.creators.every(c=>targetCreators.has(c));
  const overlap = guess.creators.some(c=>targetCreators.has(c));
  const creatorStatus = sameSet ? 'hit' : overlap ? 'part' : 'miss';
  const creatorHtml = sameSet
    ? guess.creators.join(', ')
    : guess.creators.map(name =>
        targetCreators.has(name)
          ? `<span class="name-match">${name}</span>`
          : `<span class="name-miss">${name}</span>`
      ).join(', ');

  const cells = {
    type: { status: typeStatus, html: guess.type },
    realm: { status: realmStatus, html: guess.realm },
    area: { status: areaStatus, html: guess.area },
    difficulty: { status: diffStatus, html: diffLabel(guess) + (diffStatus!=='hit' ? ' ' + diffArrow(guess,target) : '') },
    creator: { status: creatorStatus, html: creatorHtml }
  };

  let rowHtml = `<td data-label="Tower"><span class="tower-name-cell">${guess.name}</span></td>`;
  activeColumns.forEach(key=>{
    const c = cells[key];
    const label = ALL_COLUMNS.find(col=>col.key===key).label;
    const cls = (key === 'creator' && c.status === 'part') ? 'mixed' : cellClass(c.status);
    rowHtml += `<td data-label="${label}"><span class="cell ${cls}">${symbol(c.status)} ${c.html}</span></td>`;
  });
  tr.innerHTML = rowHtml;

  boardBody.appendChild(tr);
  return guess.abbr === target.abbr;
}

function endGame(won){
  over = true;
  renderNav();
  resultEl.classList.add('show', won ? 'win' : 'lose');
  resultTitle.textContent = won ? 'Correct' : 'Out of guesses';
  resultBody.textContent = won
    ? `It was ${target.name} (${target.abbr}) — ${diffLabel(target)} ${target.type.toLowerCase()} in ${target.area}, ${target.realm}.`
    : `The tower was ${target.name} (${target.abbr}) — ${diffLabel(target)} ${target.type.toLowerCase()} in ${target.area}, ${target.realm}, made by ${target.creators.join(' and ')}.`;
  resultFact.textContent = target.fact || '';
}

function handleGuess(guess){
  if(over || !guess) return;

  guessesUsed++;
  const correct = makeRow(guess);
  renderPips();
  guessesLeftEl.textContent = `${MAX_GUESSES - guessesUsed} guess${MAX_GUESSES - guessesUsed === 1 ? '' : 'es'} remaining`;

  navRealm = null;
  navArea = null;

  if(correct){
    endGame(true);
  } else if(guessesUsed >= MAX_GUESSES){
    endGame(false);
  } else {
    renderNav();
  }
}

function newGame(){
  target = TOWERS[Math.floor(Math.random() * TOWERS.length)];
  guessesUsed = 0;
  over = false;
  navRealm = null;
  navArea = null;
  boardBody.innerHTML = '';
  resultEl.classList.remove('show','win','lose');
  resultFact.textContent = '';
  guessesLeftEl.textContent = `${MAX_GUESSES} guesses remaining`;
  renderPips();
  renderNav();
}

newGameBtn.addEventListener('click', newGame);
</script>
</body>
</html>
